- name: Generate or Retrieve Secrets
  include_tasks:
    file: secrets.yml
    apply:
      tags:
        - hedgedoc.secrets
  tags:
    - hedgedoc.secrets

- name: Deploy PostgreSQL
  include_tasks:
    file: postgres.yml
    apply:
      tags:
        - hedgedoc.postgres
  tags:
    - hedgedoc.postgres

- name: Deploy Volume
  include_tasks:
    file: volume.yml
    apply:
      tags:
        - hedgedoc.volume
  tags:
    - hedgedoc.volume

- name: Deploy Web Application
  include_tasks:
    file: web.yml
    apply:
      tags:
        - hedgedoc.web
  tags:
    - hedgedoc.web
