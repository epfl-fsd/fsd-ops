- name: Check if database secret already exists
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: "{{ openshift_namespace }}"
    name: "{{ app }}-db-credentials"
  register: existing_db_secret

- name: Generate database credentials if secret doesn't exist
  block:
    - name: Generate random database credentials
      ansible.builtin.set_fact:
        db_user: "{{ app }}-user"
        db_name: "{{ app }}-db"
        db_password: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=128') }}"
      when: existing_db_secret.resources | length == 0

    - name: Create database secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ app }}-db-credentials"
            namespace: "{{ openshift_namespace }}"
            labels:
              app: "{{ app }}"
              cnpg.io/reload: "true"
          type: kubernetes.io/basic-auth
          data:
            username: "{{ db_user | b64encode }}"
            password: "{{ db_password  | b64encode }}"
            database: "{{ db_name | b64encode }}"
      when: existing_db_secret.resources | length == 0

- name: Check if application secret already exists
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: "{{ openshift_namespace }}"
    name: "{{ app }}-secrets"
  register: existing_app_secret

- name: Ensure application secrets
  block:
    - name: Generate random application secrets
      ansible.builtin.set_fact:
        session_secret: "{{ lookup('pipe', 'openssl rand -hex 64') }}"

    - name: Retrieve database credentials
      kubernetes.core.k8s_info:
        kind: Secret
        namespace: "{{ openshift_namespace }}"
        name: "{{ app }}-db-credentials"
      register: db_credentials

    - name: Prepare database connection URL
      ansible.builtin.set_fact:
        db_user: "{{ db_credentials.resources[0].data.username | b64decode }}"
        db_password: "{{ db_credentials.resources[0].data.password | b64decode }}"
        db_name: "{{ db_credentials.resources[0].data.database | b64decode }}"

    - name: Create application secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ app }}-secrets"
            namespace: "{{ openshift_namespace }}"
          type: Opaque
          stringData:
            CMD_SESSION_SECRET: "{{ session_secret }}"
            CMD_EMAIL: "false"
            CMD_ALLOW_EMAIL_REGISTER: "false"
            CMD_DOMAIN: "{{ subdomain }}{% if env == 'test' %}-test{% endif %}.{{ domain }}"
            CMD_DB_URL: "postgres://{{ db_user }}:{{ db_password }}@{{ db_host }}:5432/{{ db_name }}"
            CMD_OAUTH2_AUTHORIZATION_URL: "{{ secrets[env].auth.authorization_url }}"
            CMD_OAUTH2_TOKEN_URL: "{{ secrets[env].auth.token_url }}"
            CMD_OAUTH2_CLIENT_ID: "{{ secrets[env].auth.client_id }}"
            CMD_OAUTH2_CLIENT_SECRET: "{{ secrets[env].auth.client_secret }}"
            CMD_OAUTH2_PROVIDERNAME: "{{ secrets[env].auth.providername }}"
            CMD_OAUTH2_USER_PROFILE_URL: "https://graph.microsoft.com/oidc/userinfo"
            CMD_OAUTH2_USER_PROFILE_USERNAME_ATTR: "sub"
            CMD_OAUTH2_USER_PROFILE_DISPLAY_NAME_ATTR: "name"
            CMD_OAUTH2_USER_PROFILE_EMAIL_ATTR: "email"
            CMD_OAUTH2_USER_PROFILE_ID_ATTR: "sub"
            CMD_OAUTH2_SCOPE: "openid email profile"
            CMD_URL_ADDPORT: "false"
            CMD_CSP_ENABLE: "false"
            CMD_PROTOCOL_USESSL: "true"
            CMD_COOKIE_POLICY: "lax"
            CMD_ALLOW_ANONYMOUS: "true"
            CMD_ALLOW_ANONYMOUS_EDITS: "false"
