- name: Get PostgreSQL credentials from secret
  kubernetes.core.k8s_info:
      api_version: v1
      kind: Secret
      name: '{{ app }}-db-credentials'
      namespace: '{{ openshift_namespace }}'
  register: db_secret

- name: Set PostgreSQL connection string
  set_fact:
      pg_connection_string: >-
          postgres://{{ db_secret.resources[0].data.username | b64decode }}:{{ db_secret.resources[0].data.password | b64decode }}@postgres-cluster.{{ openshift_namespace }}.svc.cluster.local:5432/{{ db_secret.resources[0].data.database | b64decode }}

- name: Create connection string secret
  kubernetes.core.k8s:
      state: present
      definition:
          apiVersion: v1
          kind: Secret
          metadata:
              name: '{{ app }}-db-connection'
              namespace: '{{ openshift_namespace }}'
          type: Opaque
          stringData:
              DATABASE_URL: '{{ pg_connection_string }}'

- name: Create Service
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: "{{ app }}"
        namespace: "{{ openshift_namespace }}"
      spec:
        selector:
          app: "{{ app }}"
        ports:
          - name: "{{ app }}-svc-port"
            protocol: TCP
            port: 80
            targetPort: 3000

- name: Create Ingress
  kubernetes.core.k8s:
    definition:
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: "{{ app }}"
        namespace: "{{ openshift_namespace }}"
        labels:
          app: "{{ app }}"
          route: public
        annotations:
          nginx.ingress.kubernetes.io/rewrite-target: /
          kubernetes.io/ingress.class: nginx
          nginx.ingress.kubernetes.io/ssl-redirect: "true"
      spec:
        rules:
          - host: "{{ subdomain }}{% if env == 'test' %}-test{% endif %}.{{ domain }}"
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: "{{ app }}"
                      port:
                        number: 80

- name: Create Route
  kubernetes.core.k8s:
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: "{{ app }}"
        namespace: "{{ openshift_namespace }}"
        labels:
          app: "{{ app }}"
          route: public
      spec:
        host: "{{ subdomain }}{% if env == 'test' %}-test{% endif %}.{{ domain }}"
        to:
          kind: Service
          name: "{{ app }}"
        port:
          targetPort: "{{ app }}-svc-port"
        tls:
          termination: edge
          insecureEdgeTerminationPolicy: Redirect

- name: Create Deployment
  kubernetes.core.k8s:
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: "{{ app }}"
        labels:
          app: "{{ app }}"
        namespace: "{{ openshift_namespace }}"
        annotations:
          keel.sh/policy: force
          keel.sh/pollSchedule: '@every 24h'
          keel.sh/trigger: poll
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: "{{ app }}"
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxUnavailable: 1
        template:
          metadata:
            labels:
              app: "{{ app }}"
          spec:
            containers:
              - name: "{{ app }}"
                image: "{{ registry }}/{{ organisation }}/{{ image }}:{{ version }}"
                imagePullPolicy: Always
                ports:
                  - containerPort: 3000
                envFrom:
                  - secretRef:
                      name: '{{ app }}-db-connection'
                  - secretRef:
                      name: '{{ app }}-secrets'
                resources:
                  requests:
                    cpu: 500m
                    memory: 1024Mi
                  limits:
                    cpu: 1000m
                    memory: 2048Mi
                readinessProbe:
                  failureThreshold: 1
                  httpGet:
                    path: /
                    port: 80
                    scheme: HTTP
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  successThreshold: 1
                  timeoutSeconds: 2

            imagePullSecrets:
              - name: svc0176-pull-secret
