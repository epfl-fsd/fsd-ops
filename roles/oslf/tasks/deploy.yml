- name: Create service
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: "{{ app.name }}"
        namespace: "{{ openshift_namespace }}"
      spec:
        selector:
          app: "{{ app.name }}"
        ports:
          - name: "{{ app.name }}-svc-port"
            protocol: TCP
            port: 80
            targetPort: 3000

- name: Create Ingress
  kubernetes.core.k8s:
    definition:
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: "{{ app.name }}"
        namespace: "{{ openshift_namespace }}"
        annotations:
          nginx.ingress.kubernetes.io/rewrite-target: /
          kubernetes.io/ingress.class: nginx
          nginx.ingress.kubernetes.io/ssl-redirect: "true"
      spec:
        rules:
          - host: "{{ app.name }}.{{ domain }}"
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: "{{ app.name }}"
                      port:
                        number: 80

- name: Create Secret
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ app.name }}-secret"
        namespace: "{{ openshift_namespace }}"
      data:
        API_USERNAME: "{{ secrets.API_USERNAME | b64encode }}"
        API_PASSWORD: "{{ secrets.API_PASSWORD | b64encode }}"
        API_URL: "{{ secrets.API_URL | b64encode }}"

- name: Create Deployment
  kubernetes.core.k8s:
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: "{{ app.name }}"
        namespace: "{{ openshift_namespace }}"
      spec:
        replicas: 2
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxUnavailable: 1
        selector:
          matchLabels:
            app: "{{ app.name }}"
        template:
          metadata:
            labels:
              app: "{{ app.name }}"
          spec:
            containers:
              - image: "{{ app.registry }}/{{ app.name }}:{{ app.version }}"
                imagePullPolicy: Always
                name: "{{ app.name }}"
                ports:
                  - containerPort: 3000
                envFrom:
                  - secretRef:
                      name: "{{ app.name }}-secret"
                resources:
                  requests:
                    cpu: "50m"
                    memory: "64Mi"
                  limits:
                    cpu: "100m"
                    memory: "128Mi"
                readinessProbe:
                  tcpSocket:
                    port: 3000
                  initialDelaySeconds: 5
                  timeoutSeconds: 3
                livenessProbe:
                  tcpSocket:
                    port: 3000
                  initialDelaySeconds: 5
                  timeoutSeconds: 3
